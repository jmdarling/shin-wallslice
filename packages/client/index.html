<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f0f7" />
    <!-- Paint the canvas before the application and its styles finish loading. -->
    <style>
      :root {
        background: #f1f0f7;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.wa-light) {
          background: #201e2a;
          color-scheme: dark;
        }
      }
      :root.wa-dark {
        background: #201e2a;
        color-scheme: dark;
      }
    </style>
    <script type="module" src="/src/theme.ts"></script>
    <title>shin-wallslice</title>
  </head>
  <body>
    <shin-app></shin-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
